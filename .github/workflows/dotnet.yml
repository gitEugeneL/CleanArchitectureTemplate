name: DOTNET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore CleanArchitectureTemplate.sln

      - name: Build
        run: dotnet build CleanArchitectureTemplate.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test CleanArchitectureTemplate.sln --no-build --configuration Release --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Up
        run: make up

      - name: Wait for services
        run: sleep 10

      - name: Check containers are running
        run: docker compose ps --status running | grep -q postgres

      - name: Down and clean
        if: always()
        run: make down-and-clean