services:
  postgres:
    image: postgres:18-alpine
    container_name: database
    environment: 
      POSTGRES_DB: api
      POSTGRES_USER: user # only for dev
      POSTGRES_PASSWORD: password # only  for dev
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: