services:
  postgres:
    image: postgres:18-alpine
    container_name: database
    environment: 
      POSTGRES_DB: api                # only for dev
      POSTGRES_USER: user             # only for dev
      POSTGRES_PASSWORD: password     # only for dev
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    ports:
      - "5432:5432"                   # only for dev
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - clean-arch-example
    
  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"                   # only for dev
    volumes:
      - redis_data:/data
    networks:
      - clean-arch-example
      
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - clean-arch-example
    depends_on:
      - redis
        
networks:
  clean-arch-example:
    driver: bridge
    
volumes:
  postgres_data:
  redis_data: